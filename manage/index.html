<main class="shell">

      <h2>設定存取碼</h2>
      <p class="config-note">存取碼只保留在這次瀏覽器工作階段，不會寫進網址或 GitHub。</p>
    </div>
    <div class="config-actions">
      <input id="platformTokenInput" type="password" autocomplete="off" placeholder="活動平台存取碼" aria-label="活動平台存取碼">
      <button id="platformSaveConfig" type="button">套用</button>
    </div>
  </section>
  <div id="platformStatus" class="status" aria-live="polite"></div>
  <section id="entryView" aria-label="活動管理"></section>
  <section id="sectionView" aria-label="活動區塊" hidden></section>
