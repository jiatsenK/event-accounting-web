<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>活動帳務</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#252525;background:#f7f7f5}body{max-width:980px;margin:0 auto;padding:28px 16px 56px}h1{font-size:28px;margin:2px 0 6px}h2{font-size:20px;margin:0 0 14px}.muted{color:#777;font-size:14px}.section-label{font-size:13px;color:#777;font-weight:650;letter-spacing:.02em}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{background:white;border:1px solid #e5e5e0;border-radius:12px;padding:16px}.label{font-size:13px;color:#777}.value{font-size:24px;font-weight:700;margin-top:5px}.value.danger{color:#a12d2d}.status{min-height:24px;margin:12px 0;color:#3b6650}.status.error{color:#9b2c2c}.form-status{margin:8px 0 0}.advance-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #eee}.advance-row:last-child{border-bottom:0}form{display:grid;gap:10px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #d8d8d2;border-radius:8px;background:white}button{background:#2f4858;color:white;border:none;font-weight:600;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:white;color:#2f4858;border:1px solid #bfc8ce}.form-actions{display:flex;gap:10px}.form-actions button{flex:1}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid #eee;white-space:nowrap}.num{text-align:right}.table-action{padding:6px 9px;background:white;color:#2f4858;border:1px solid #bfc8ce;font-size:13px}.empty{text-align:center;color:#888;padding:24px}.empty.compact{padding:8px 0}.config-note{margin:0 0 10px;color:#666;font-size:14px}.section{margin-top:14px}.budget-alert{padding:10px 12px;border-radius:8px;margin-bottom:10px;font-weight:650}.budget-alert.danger{background:#fff2f0;color:#9b2c2c}.budget-alert.ok{background:#f0f7f2;color:#35634a}.budget-alert.warning{background:#fff8e6;color:#7a5a00}.budget-over{color:#a12d2d;font-weight:700}.budget-under{color:#35634a;font-weight:650}.budget-even{color:#666}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid,.row{grid-template-columns:1fr}body{padding-top:20px}.form-actions{flex-direction:column}}
</style>
</head>
<body>
<div class="section-label">活動帳務</div>
<h1 id="activityName">讀取活動中…</h1>
<div id="activityMeta" class="muted"></div>
<div id="configPanel" class="card section" hidden><h2>第一次設定</h2><p class="config-note">輸入活動帳務存取碼。存取碼只保留在這次瀏覽器工作階段，不會寫進網址或 GitHub。</p><input id="tokenInput" type="password" autocomplete="off" placeholder="存取碼"><button id="saveConfig" type="button" style="margin-top:10px">開始使用</button></div>
<div id="appContent">
<div id="status" class="status"></div>
<div class="grid">
  <div class="card"><div class="label">活動預算</div><div id="budget" class="value">讀取中…</div></div>
  <div class="card"><div class="label">目前實際支出</div><div id="actualExpense" class="value">讀取中…</div></div>
  <div class="card"><div class="label">預算剩餘</div><div id="budgetRemaining" class="value">讀取中…</div></div>
  <div class="card"><div class="label">零用金暫支</div><div id="pettyCashAdvance" class="value">讀取中…</div></div>
  <div class="card"><div class="label">零用金扣抵合計</div><div id="pettyCashUsed" class="value">讀取中…</div></div>
  <div class="card"><div class="label">需沖銷金額</div><div id="pettyCashRemaining" class="value">讀取中…</div></div>
</div>
<div class="card section"><h2>預算執行情況</h2><div id="budgetAlert" class="budget-alert warning">讀取中…</div><div style="overflow:auto"><table><thead><tr><th>預算項目</th><th class="num">核准預算</th><th class="num">實際支出</th><th class="num">差異</th></tr></thead><tbody id="budgetRows"><tr><td colspan="4" class="empty">讀取中…</td></tr></tbody></table></div></div>
<div class="card section"><h2>待核銷代墊</h2><div id="pendingAdvances"><div class="empty compact">讀取中…</div></div></div>
<div class="card section"><h2>下載表單</h2><p class="muted">依照過去零用金費用明細格式產生流水帳：零用金請款 → 每筆扣抵 → 最後沖銷歸零。</p><div class="form-actions"><button id="generatePettyCashReport" type="button">下載零用金支出表（Excel）</button></div><div id="reportStatus" class="status form-status" aria-live="polite"></div></div>
<div id="expenseEditor" class="card section"><h2 id="expenseFormTitle">新增支出</h2><form id="expenseForm"><div class="row"><input name="date" type="date" required><input name="amount" type="number" min="1" step="1" placeholder="金額" required></div><div class="row"><input name="item" placeholder="項目，例如：車資" required><input name="category" placeholder="分類（選填）"></div><div class="row"><select name="budget_item" required><option value="">選擇預算項目</option></select><select name="payment_method" required><option value="公司轉帳">公司轉帳</option><option value="活動零用金">活動零用金</option><option value="個人代墊">個人代墊</option></select></div><input name="payer" placeholder="支付人，個人代墊時必填"><textarea name="note" placeholder="備註（選填）"></textarea><div class="form-actions"><button id="submitExpenseButton" type="submit">登記支出</button><button id="cancelEdit" class="secondary" type="button" hidden>取消修改</button></div><div id="expenseStatus" class="status form-status" aria-live="polite"></div></form></div>
<div class="card section"><h2>支出明細</h2><div style="overflow:auto"><table><thead><tr><th>日期</th><th>項目</th><th>預算項目</th><th>支付方式</th><th>支付人</th><th>核銷狀態</th><th class="num">金額</th><th></th></tr></thead><tbody id="expenseRows"><tr><td colspan="8" class="empty">讀取中…</td></tr></tbody></table></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="assets/domain.js?v=20260830-7"></script><script src="assets/app.js?v=20260830-14"></script>
</body></html>
